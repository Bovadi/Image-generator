<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIP Visualized — Image Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #d0e8f7 0%, #c5d8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Modal card ── */
    .modal {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 720px;
      padding: 32px 32px 28px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 20px;
      color: #a0aec0;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
    }

    .modal-close:hover { color: #4a5568; }

    /* ── Config row (key) ── */
    .key-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 14px;
    }

    .key-row label {
      font-size: 12px;
      font-weight: 700;
      color: #718096;
      white-space: nowrap;
    }

    .key-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: monospace;
      color: #2d3748;
      outline: none;
    }

    /* ── Title ── */
    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 16px;
    }

    /* ── Filter toggles ── */
    .filters {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .toggle-group {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      padding: 8px 28px;
      border-radius: 99px;
      border: 1.5px solid #d0d8e8;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      color: #718096;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn:hover { border-color: #4B9EF4; color: #4B9EF4; }

    .toggle-btn.active {
      background: #4B9EF4;
      border-color: #4B9EF4;
      color: #fff;
    }

    /* ── Section label ── */
    h2 {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 14px;
    }

    /* ── Character scroll ── */
    .char-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 20px;
    }

    .char-scroll::-webkit-scrollbar { height: 4px; }
    .char-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 99px; }

    .char-card {
      flex: 0 0 130px;
      scroll-snap-align: start;
      border: 2.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 8px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      background: #fff;
      position: relative;
    }

    .char-card:hover { border-color: #4B9EF4; background: #f0f8ff; }

    .char-card.selected {
      border-color: #4B9EF4;
      background: #f0f8ff;
    }

    .char-card.selected .check-badge {
      display: flex;
    }

    .check-badge {
      display: none;
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 22px;
      height: 22px;
      background: #4B9EF4;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .char-avatar {
      width: 90px;
      height: 110px;
      margin: 0 auto 8px;
      border-radius: 10px;
      background: linear-gradient(160deg, #e8f4fd 0%, #d6ecf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      overflow: hidden;
    }

    .char-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .char-name {
      font-size: 11.5px;
      font-weight: 600;
      color: #2d3748;
      line-height: 1.3;
    }

    .char-card.hidden { display: none; }

    /* ── Bottom bar ── */
    .bottom-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .scenario-input {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      background: #f9fbff;
      transition: border-color 0.15s;
    }

    .scenario-input:focus-within {
      border-color: #4B9EF4;
      box-shadow: 0 0 0 3px rgba(75,158,244,0.12);
    }

    .scenario-input svg { color: #a0aec0; flex-shrink: 0; }

    .scenario-input input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #2d3748;
      outline: none;
      font-family: inherit;
    }

    .scenario-input input::placeholder { color: #a0aec0; }

    .btn-generate {
      background: #4B9EF4;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-generate:hover:not(:disabled) { background: #2b7fd4; transform: translateY(-1px); }
    .btn-generate:disabled { background: #a5c8f8; cursor: not-allowed; }

    .hint {
      text-align: center;
      font-size: 12.5px;
      color: #a0aec0;
      margin-top: 10px;
    }

    /* ── Loading ── */
    .loading { display: none; text-align: center; padding: 24px 0 8px; }
    .loading.visible { display: block; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #4B9EF4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-msg {
      display: none;
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c53030;
      margin-top: 12px;
    }
    .error-msg.visible { display: block; }

    /* ── Result ── */
    .result { display: none; margin-top: 20px; }
    .result.visible { display: block; }

    .result img {
      width: 615px;
      height: 315px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      display: block;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover { background: #f0f8ff; border-color: #4B9EF4; color: #4B9EF4; }
  </style>
</head>
<body>

<div class="modal">
  <button class="modal-close" onclick="this.parentElement.style.opacity=0.5">✕</button>

  <!-- API key -->
  <div class="key-row">
    <label>FAL KEY</label>
    <input type="password" id="falKey" placeholder="paste your fal.ai key" />
  </div>

  <h1>Select a Character</h1>

  <!-- Filters -->
  <div class="filters">
    <div class="toggle-group" id="genderGroup">
      <button class="toggle-btn active" data-gender="boy" onclick="setFilter('gender','boy',this)">
        👦 Boy
      </button>
      <button class="toggle-btn" data-gender="girl" onclick="setFilter('gender','girl',this)">
        👧 Girl
      </button>
    </div>
    <div class="toggle-group" id="ageGroup">
      <button class="toggle-btn active" data-age="child" onclick="setFilter('age','child',this)">
        Child
      </button>
      <button class="toggle-btn" data-age="teen" onclick="setFilter('age','teen',this)">
        Teen
      </button>
    </div>
  </div>

  <h2>Select a Character</h2>

  <!-- Character row -->
  <div class="char-scroll" id="charScroll"></div>

  <!-- Inputs -->
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
    <div class="scenario-input">
      <span style="font-size:11px;font-weight:700;color:#a0aec0;white-space:nowrap;min-width:60px;">ACTION</span>
      <input type="text" id="verb" placeholder="e.g. doing homework, crying, asking for a break" />
    </div>
    <div class="scenario-input">
      <span style="font-size:11px;font-weight:700;color:#a0aec0;white-space:nowrap;min-width:60px;">LOCATION</span>
      <input type="text" id="location" placeholder="e.g. in a classroom, at the kitchen table, on the playground" />
    </div>
    <div class="scenario-input">
      <span style="font-size:11px;font-weight:700;color:#a0aec0;white-space:nowrap;min-width:60px;">OBJECTS</span>
      <input type="text" id="objects" placeholder="optional — e.g. coloring book open in her lap, crayons on the floor" />
    </div>
    <div class="scenario-input">
      <span style="font-size:11px;font-weight:700;color:#a0aec0;white-space:nowrap;min-width:60px;">ADULTS</span>
      <input type="text" id="supporting" placeholder="optional — e.g. a female teacher with short gray hair" />
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end;">
    <button class="btn-generate" id="generateBtn" onclick="generate()">Generate</button>
  </div>

  <p class="hint" id="hintText">Select a character, fill in the action and location, then hit Generate.</p>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="font-size:14px;color:#718096;font-weight:600">Generating image — ~15–30 seconds</p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Result -->
  <div class="result" id="result">
    <img id="resultImg" src="" alt="Generated image" />
    <div class="result-actions">
      <button class="btn-secondary" onclick="generate()">↺ Regenerate</button>
      <button class="btn-secondary" onclick="downloadImg()">↓ Download</button>
    </div>
  </div>
</div>

    { id:"hispanic_boy_teen",          gender:"boy",  age:"teen",  label:"Hispanic",        emoji:"🧑🏽", trigger:"BIPCHAR_hispanic_teen_boy",        desc:"teenage Hispanic boy, medium-length dark hair, green bomber jacket, dark jeans, black shoes",                   lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"white_boy_teen",             gender:"boy",  age:"teen",  label:"White",           emoji:"🧑🏼", trigger:"BIPCHAR_white_teen_boy",           desc:"teenage white boy, light brown hair, navy t-shirt, khaki pants, gray sneakers",                                 lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"south_asian_boy_teen",       gender:"boy",  age:"teen",  label:"South Asian",     emoji:"🧑🏽", trigger:"BIPCHAR_south_asian_teen_boy",     desc:"teenage South Asian boy, dark hair, teal hoodie, black jeans, white sneakers",                                  lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },

    { id:"asian_girl_teen",            gender:"girl", age:"teen",  label:"Asian",           emoji:"🧑🏻", trigger:"BIPCHAR_asian_teen_girl",          desc:"teenage Asian girl, black hair in a ponytail, pink hoodie, light jeans, white sneakers",                        lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"black_girl_teen",            gender:"girl", age:"teen",  label:"Black",           emoji:"🧑🏾", trigger:"BIPCHAR_black_teen_girl",          desc:"teenage Black girl, natural afro, purple jacket, black leggings, white sneakers",                                lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"hispanic_girl_teen",         gender:"girl", age:"teen",  label:"Hispanic",        emoji:"🧑🏽", trigger:"BIPCHAR_hispanic_teen_girl",       desc:"teenage Hispanic girl, long dark wavy hair, orange sweater, blue jeans, white sneakers",                        lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"white_girl_teen",            gender:"girl", age:"teen",  label:"White",           emoji:"🧑🏼", trigger:"BIPCHAR_white_teen_girl",          desc:"teenage white girl, straight blond hair, light pink cardigan, white shirt, blue jeans, tan boots",               lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"south_asian_girl_teen",      gender:"girl", age:"teen",  label:"South Asian",     emoji:"🧑🏽", trigger:"BIPCHAR_south_asian_teen_girl",    desc:"teenage South Asian girl, long black hair, purple hoodie, dark jeans, purple sneakers",                         lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
    { id:"middle_eastern_girl_teen",   gender:"girl", age:"teen",  label:"Middle Eastern",  emoji:"🧑🏻", trigger:"BIPCHAR_middle_eastern_teen_girl", desc:"teenage Middle Eastern girl, dark hair with navy blue hijab, teal jacket, dark jeans, white sneakers",          lora:"https://huggingface.co/alvdansen/frosting_lane_redux/resolve/main/fluxtest.safetensors" },
  ];

  const STYLE = "flat illustration style, clean lines, minimal shading, solid flat colors, educational illustration, child-friendly, friendly cartoon, full rectangular scene, edge to edge background, bedroom walls and floor visible, no text, no words";
  const NEG   = "realistic, photographic, 3D render, complex shading, dark, scary, violent, sexual, text, watermark, holding hands, hand holding, touching hands, vignette, oval mask, circular crop, blob background, faded edges, plain background, white background, gradient background, no background";

  let activeGender = "boy";
  let activeAge    = "child";
  let selectedId   = null;

  // ── Filters ──────────────────────────────────────────────────────────────
  function setFilter(type, value, btn) {
    if (type === "gender") {
      activeGender = value;
      document.querySelectorAll("#genderGroup .toggle-btn").forEach(b => b.classList.remove("active"));
    } else {
      activeAge = value;
      document.querySelectorAll("#ageGroup .toggle-btn").forEach(b => b.classList.remove("active"));
    }
    btn.classList.add("active");
    selectedId = null;
    renderChars();
    updateHint();
  }

  // ── Render character cards ────────────────────────────────────────────────
  function renderChars() {
    const scroll = document.getElementById("charScroll");
    scroll.innerHTML = "";
    const filtered = CHARACTERS.filter(c => c.gender === activeGender && c.age === activeAge);

    filtered.forEach(char => {
      const card = document.createElement("div");
      card.className = "char-card" + (char.id === selectedId ? " selected" : "");
      card.dataset.id = char.id;
      card.onclick = () => selectChar(char.id);
      const isTrained = !char.lora.includes("huggingface.co") && char.lora !== "PASTE_LORA_URL_HERE";
      card.innerHTML = `
        <div class="char-avatar">${char.emoji}</div>
        <div class="char-name">${char.label}</div>
        ${isTrained ? '<div style="font-size:9px;color:#38a169;font-weight:700;margin-top:3px">✓ TRAINED</div>' : ''}
        <div class="check-badge">✓</div>
      `;
      scroll.appendChild(card);
    });
  }

  function selectChar(id) {
    selectedId = id;
    renderChars();
    updateHint();
  }

  function updateHint() {
    const hint = document.getElementById("hintText");
    if (!selectedId) {
      hint.textContent = "Select a character and enter a scenario to generate an image.";
    } else {
      const c = CHARACTERS.find(x => x.id === selectedId);
      hint.textContent = `Selected: ${c.label} ${activeAge} — type a scenario and hit Generate.`;
    }
  }

  // ── Generate ──────────────────────────────────────────────────────────────
  async function generate() {
    const falKey   = document.getElementById("falKey").value.trim();
    const verb     = document.getElementById("verb").value.trim();
    const location = document.getElementById("location").value.trim();
    const supportingRaw = document.getElementById("supporting").value.trim().toLowerCase();
    const hasAdult = supportingRaw && supportingRaw !== "none" && supportingRaw !== "no" && supportingRaw !== "n/a";

    if (!falKey)    { showError("Enter your fal.ai key at the top."); return; }
    if (!selectedId){ showError("Select a character first."); return; }
    if (!verb)      { showError("Enter an action first."); return; }
    if (!location)  { showError("Enter a location first."); return; }

    const char = CHARACTERS.find(c => c.id === selectedId);

    if (char.lora === "PASTE_LORA_URL_HERE") {
      showError("This character's LoRA isn't trained yet.");
      return;
    }

    const isTrained = !char.lora.includes("huggingface.co") && char.lora !== "PASTE_LORA_URL_HERE";
    const objectsRaw = document.getElementById("objects").value.trim();
    const objectsClause = objectsRaw ? `, ${objectsRaw} clearly visible` : "";
    const adultPrefix = hasAdult
      ? `scene includes a fully grown adult ${supportingRaw}, adult body proportions, clearly taller than the child, mature facial features. `
      : "";
    const soloClause = hasAdult ? "" : ", only one child in the scene, no other people";
    const prompt = `${adultPrefix}${location}, ${char.trigger}, ${char.desc}, actively ${verb}${objectsClause}${soloClause}, full body, dynamic action pose, full scene with walls floor and furniture visible. ${STYLE}.`;

    setLoading(true);
    clearError();
    hideResult();

    try {
      const body = {
        prompt,
        negative_prompt: NEG,
        image_size: { width: 1024, height: 512 },
        num_inference_steps: 35,
        guidance_scale: 7.0,
        num_images: 1,
        enable_safety_checker: true,
      };
      if (isTrained) body.loras = [{ path: char.lora, scale: 0.75 }];

      const res = await fetch("https://fal.run/fal-ai/flux-lora", {
        method: "POST",
        headers: {
          "Authorization": `Key ${falKey}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) throw new Error(`fal.ai error ${res.status}: ${await res.text()}`);

      const data = await res.json();
      const url  = data?.images?.[0]?.url;
      if (!url) throw new Error("No image returned.");
      showResult(url);
    } catch(e) {
      showError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function setLoading(on) {
    document.getElementById("loading").classList.toggle("visible", on);
    document.getElementById("generateBtn").disabled = on;
    document.getElementById("generateBtn").textContent = on ? "Generating…" : "Generate";
  }

  function showResult(url) {
    const r = document.getElementById("result");
    document.getElementById("resultImg").src = url;
    r.classList.add("visible");
  }

  function hideResult() { document.getElementById("result").classList.remove("visible"); }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.classList.add("visible");
  }

  function clearError() { document.getElementById("errorMsg").classList.remove("visible"); }

  function downloadImg() {
    const a = document.createElement("a");
    a.href = document.getElementById("resultImg").src;
    a.download = `bip-${selectedId}-${Date.now()}.png`;
    a.click();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  renderChars();
</script>

</body>
</html>
